name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: java8
        with:
          distribution: temurin
          java-version: "8"

      - name: Build MIDPath runtime jars from ohayoyogi/midpath
        run: scripts/build-midpath.sh
        env:
          JAVA8_HOME: ${{ steps.java8.outputs.path }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html play.html manage.html .nojekyll public lib samples COPYING LICENSE _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
