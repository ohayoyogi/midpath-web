name: Deploy to GitHub Pages

# Builds the site and publishes it by committing to the gh-pages branch, which GitHub Pages
# serves ("Deploy from a branch: gh-pages").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: java8
        with:
          distribution: temurin
          java-version: "8"

      - name: Build MIDPath runtime jars from ohayoyogi/midpath
        run: scripts/build-midpath.sh
        env:
          JAVA8_HOME: ${{ steps.java8.outputs.path }}

      - name: Assemble site
        run: scripts/assemble-site.sh _site "${GITHUB_SHA::7}"

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish to gh-pages
        run: |
          rsync -a --delete --exclude .git _site/ gh-pages/
          cd gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
