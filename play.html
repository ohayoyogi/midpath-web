<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIDPath-Web Player</title>
    <link rel="stylesheet" href="./public/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"></span>MIDPath-Web</a>
        <span class="header-spacer"></span>
        <a class="header-link" href="./" data-i18n="player.back"></a>
        <button class="lang-toggle" id="lang-toggle" type="button">English</button>
      </div>
    </header>

    <main class="wrap player-layout">
      <div class="phone">
        <div class="phone-speaker" aria-hidden="true"></div>
        <div class="screen-frame" id="screen-frame">
          <div id="display"></div>
          <div class="screen-overlay" id="overlay">
            <div class="spinner" id="overlay-spinner"></div>
            <div id="overlay-text" data-i18n="player.loading"></div>
            <small id="overlay-sub" data-i18n="player.loading2"></small>
            <button class="btn btn-primary" id="overlay-action" type="button" hidden data-i18n="player.restart"></button>
          </div>
        </div>

        <div class="keypad" id="keypad" aria-label="Keypad">
          <div class="keypad-top">
            <div class="soft-col">
              <button class="key soft" data-key="soft1" type="button" data-i18n="key.soft1"></button>
            </div>
            <div class="dpad">
              <button class="key k-up" data-key="up" type="button" aria-label="Up">▲</button>
              <button class="key k-left" data-key="left" type="button" aria-label="Left">◀</button>
              <button class="key k-fire" data-key="fire" type="button" aria-label="Select">●</button>
              <button class="key k-right" data-key="right" type="button" aria-label="Right">▶</button>
              <button class="key k-down" data-key="down" type="button" aria-label="Down">▼</button>
            </div>
            <div class="soft-col right">
              <button class="key soft" data-key="soft2" type="button" data-i18n="key.soft2"></button>
            </div>
          </div>
          <div class="numpad">
            <button class="key" data-key="1" type="button">1</button>
            <button class="key" data-key="2" type="button">2<small>abc</small></button>
            <button class="key" data-key="3" type="button">3<small>def</small></button>
            <button class="key" data-key="4" type="button">4<small>ghi</small></button>
            <button class="key" data-key="5" type="button">5<small>jkl</small></button>
            <button class="key" data-key="6" type="button">6<small>mno</small></button>
            <button class="key" data-key="7" type="button">7<small>pqrs</small></button>
            <button class="key" data-key="8" type="button">8<small>tuv</small></button>
            <button class="key" data-key="9" type="button">9<small>wxyz</small></button>
            <button class="key" data-key="star" type="button">*</button>
            <button class="key" data-key="0" type="button">0</button>
            <button class="key" data-key="pound" type="button">#</button>
          </div>
        </div>
      </div>

      <div class="player-side">
        <h1 id="app-title">MIDlet</h1>
        <p class="sub" id="app-sub"></p>

        <div class="panel">
          <h2 data-i18n="player.view"></h2>
          <div class="toolbar">
            <span data-i18n="player.zoom"></span>
            <div class="seg" id="zoom">
              <button type="button" data-zoom="1">1×</button>
              <button type="button" data-zoom="1.5">1.5×</button>
              <button type="button" data-zoom="2">2×</button>
            </div>
            <button class="btn btn-ghost" type="button" id="btn-fullscreen" data-i18n="player.fullscreen"></button>
            <button class="btn btn-ghost" type="button" id="btn-reload" data-i18n="player.reload"></button>
          </div>
        </div>

        <div class="panel" id="game-keys" hidden>
          <h2 data-i18n="player.controls"></h2>
          <table class="keys-table" id="game-keys-table"></table>
        </div>

        <div class="panel">
          <h2 data-i18n="player.keyboard"></h2>
          <p class="card-desc" data-i18n="player.hint"></p>
          <table class="keys-table">
            <tr><td><kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd></td><td data-i18n="player.keymap.arrows"></td></tr>
            <tr><td><kbd>Enter</kbd></td><td data-i18n="player.keymap.fire"></td></tr>
            <tr><td><kbd>F1</kbd> / <kbd>F2</kbd></td><td data-i18n="player.keymap.soft"></td></tr>
            <tr><td><kbd>0</kbd>–<kbd>9</kbd></td><td data-i18n="player.keymap.num"></td></tr>
          </table>
        </div>

        <details class="panel">
          <summary data-i18n="player.log"></summary>
          <pre class="log" id="console"></pre>
        </details>
      </div>
    </main>

    <script type="module">
      import { SAMPLES, t, applyI18n, setupLangToggle, el } from "./public/site.js";
      import { getJar } from "./public/library.js";
      import { initRuntime, runJar, provideJar, fetchJar } from "./public/runtime.js";

      const params = new URLSearchParams(location.search);
      const overlay = document.getElementById("overlay");
      const overlayText = document.getElementById("overlay-text");
      const overlaySub = document.getElementById("overlay-sub");
      const overlaySpinner = document.getElementById("overlay-spinner");
      const overlayAction = document.getElementById("overlay-action");
      const display = document.getElementById("display");

      // ---- what to run ------------------------------------------------------
      let target = null;
      if (params.has("sample")) {
        const s = SAMPLES.find((x) => x.id === params.get("sample"));
        if (s) target = { kind: "sample", sample: s, title: s.title };
      } else if (params.has("local")) {
        target = { kind: "local", id: params.get("local"), title: params.get("local") };
      } else if (params.has("legacy")) {
        target = { kind: "legacy", file: params.get("legacy"), title: params.get("legacy") };
      }

      function renderInfo() {
        applyI18n();
        if (!target) return;
        document.getElementById("app-title").textContent = target.title;
        document.title = `${target.title} – MIDPath-Web`;
        const lang = document.documentElement.lang;
        const sub = document.getElementById("app-sub");
        if (target.sample) sub.textContent = target.sample.desc[lang];
        else if (target.record) sub.textContent = [target.record.vendor, target.record.version && "v" + target.record.version, target.record.fileName].filter(Boolean).join(" · ");
        const keys = target.sample?.keys?.[lang];
        document.getElementById("game-keys").hidden = !keys;
        if (keys) {
          document.getElementById("game-keys-table").replaceChildren(
            ...keys.map(([k, v]) => el("tr", {}, el("td", {}, el("kbd", {}, k)), el("td", {}, v)))
          );
        }
      }
      setupLangToggle(renderInfo);

      function showMessage(textKey, { spinner = false, action = false, detail = "" } = {}) {
        overlay.hidden = false;
        overlaySpinner.hidden = !spinner;
        overlayText.dataset.i18n = textKey;
        overlayText.textContent = t(textKey);
        overlaySub.removeAttribute("data-i18n");
        overlaySub.textContent = detail;
        overlayAction.hidden = !action;
      }
      overlayAction.addEventListener("click", () => location.reload());

      // ---- zoom / fullscreen ------------------------------------------------
      const frame = document.getElementById("screen-frame");
      const zoomButtons = [...document.querySelectorAll("#zoom button")];
      function setZoom(z) {
        frame.style.zoom = z;
        zoomButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.zoom === String(z))));
        try { localStorage.setItem("zoom", String(z)); } catch {}
      }
      let savedZoom = null;
      try { savedZoom = localStorage.getItem("zoom"); } catch {}
      setZoom(savedZoom || (innerWidth >= 900 && innerHeight >= 860 ? "1.5" : "1"));
      zoomButtons.forEach((b) => b.addEventListener("click", () => setZoom(b.dataset.zoom)));
      document.getElementById("btn-fullscreen").addEventListener("click", () => frame.requestFullscreen?.());
      document.getElementById("btn-reload").addEventListener("click", () => location.reload());

      // ---- on-screen keypad -------------------------------------------------
      // Key codes follow lib/configuration/.../configuration.cfg (Java VK codes as
      // produced by CheerpJ from these DOM keys).
      const KEYS = {
        up: ["ArrowUp", "ArrowUp", 38],
        down: ["ArrowDown", "ArrowDown", 40],
        left: ["ArrowLeft", "ArrowLeft", 37],
        right: ["ArrowRight", "ArrowRight", 39],
        fire: ["Enter", "Enter", 13],
        soft1: ["F1", "F1", 112],
        soft2: ["F2", "F2", 113],
        star: ["*", "NumpadMultiply", 106],
        pound: ["#", "Digit3", 51],
      };
      for (let d = 0; d <= 9; d++) KEYS[String(d)] = [String(d), `Digit${d}`, 48 + d];

      function keyTarget() {
        const active = document.activeElement;
        if (active && active !== document.body && display.contains(active)) return active;
        return display.querySelector("textarea, input, canvas, [tabindex]") || display;
      }
      function sendKey(name, type) {
        const [key, code, keyCode] = KEYS[name];
        const ev = new KeyboardEvent(type, { key, code, bubbles: true, cancelable: true, composed: true });
        for (const prop of ["keyCode", "which"]) Object.defineProperty(ev, prop, { get: () => keyCode });
        keyTarget().dispatchEvent(ev);
      }
      document.querySelectorAll("#keypad .key").forEach((btn) => {
        const name = btn.dataset.key;
        let held = false;
        const release = () => {
          if (!held) return;
          held = false;
          btn.classList.remove("is-down");
          sendKey(name, "keyup");
        };
        btn.addEventListener("pointerdown", (e) => {
          // Keep focus on the Java display so physical keys keep working.
          e.preventDefault();
          held = true;
          btn.classList.add("is-down");
          btn.setPointerCapture?.(e.pointerId);
          sendKey(name, "keydown");
          if (name.length === 1 || name === "star" || name === "pound") sendKey(name, "keypress");
        });
        btn.addEventListener("pointerup", release);
        btn.addEventListener("pointercancel", release);
        btn.addEventListener("contextmenu", (e) => e.preventDefault());
      });
      // F1 would otherwise open the browser's help page.
      window.addEventListener("keydown", (e) => {
        if (e.key === "F1" || e.key === "F2") e.preventDefault();
      });

      // ---- start ------------------------------------------------------------
      async function start() {
        renderInfo();
        if (!target) {
          showMessage("player.notfound", { detail: "" });
          return;
        }
        let bytes = null;
        if (target.kind === "local") {
          const rec = await getJar(target.id).catch(() => null);
          if (!rec) {
            showMessage("player.notfound", { detail: target.id });
            return;
          }
          target.record = rec;
          target.title = rec.title || rec.fileName;
          renderInfo();
          bytes = new Uint8Array(await rec.data.arrayBuffer());
        }

        showMessage("player.loading", { spinner: true, detail: t("player.loading2") });
        try {
          await initRuntime({ debug: params.has("debug") });
          // 240x320 screen (configuration.cfg) plus room for the AWT frame decoration.
          cheerpjCreateDisplay(256, 352, display);

          let jarPath;
          if (target.kind === "sample") {
            const name = target.sample.jar.split("/").pop();
            jarPath = await provideJar(name, await fetchJar(target.sample.jar));
          } else if (target.kind === "local") jarPath = await provideJar(target.record.fileName, bytes);
          else jarPath = `/files/${target.file}`;

          showMessage("player.starting", { spinner: true });
          // Reveal the screen as soon as Java starts drawing into the display.
          const observer = new MutationObserver(() => {
            overlay.hidden = true;
            observer.disconnect();
          });
          observer.observe(display, { childList: true, subtree: true, attributes: true });
          setTimeout(() => {
            overlay.hidden = true;
            observer.disconnect();
          }, 10000);

          const exitCode = await runJar(jarPath);
          observer.disconnect();
          showMessage("player.exited", { action: true, detail: exitCode ? `exit ${exitCode}` : "" });
        } catch (err) {
          console.error(err);
          showMessage("player.error", { action: true, detail: String(err?.message || err) });
        }
      }
      start();
    </script>
  </body>
</html>
